<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    background: linear-gradient(180deg, #8fd0ff 0%, #c9ecff 38%, #fff2dc 100%) fixed;
    color: #2b2b2b;
    display: flex; flex-direction: column; align-items: center;
    padding: 48px 16px;
  }
  h1 { font-size: clamp(30px, 7vw, 48px); color: #ff7a2f; text-shadow: 3px 3px 0 #fff; }
  .sub { margin: 10px 0 6px; font-size: 18px; color: #555; }
  .note { margin: 0 0 36px; font-size: 15px; color: #8a6d3b; text-align: center; }
  .grid {
    display: grid; gap: 24px; width: 100%; max-width: 1080px;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  }
  .card {
    text-decoration: none; color: inherit;
    background: #fff; border-radius: 28px; padding: 32px 20px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    border: 5px solid var(--c);
    box-shadow: 0 8px 0 var(--c);
    transition: transform .15s, box-shadow .15s;
  }
  a.card:hover, a.card:focus-visible { transform: translateY(-6px); box-shadow: 0 14px 0 var(--c); outline: none; }
  a.card:active { transform: translateY(4px); box-shadow: 0 4px 0 var(--c); }
  .icon {
    width: 120px; height: 120px; border-radius: 50%;
    background: var(--bg); display: grid; place-items: center;
    font-size: 64px; margin-bottom: 18px;
  }
  .subject { font-size: 34px; font-weight: 800; color: var(--c); margin-bottom: 20px; }
  .go {
    margin-top: auto; padding: 10px 28px; border-radius: 999px;
    background: var(--c); color: #fff; font-weight: 700; font-size: 18px;
  }
  .social  { --c: #e8913a; --bg: #fff0dc; }
  .chinese { --c: #d94f70; --bg: #ffe3ea; }
  .english { --c: #6c5ce7; --bg: #ece9ff; }
  .science { --c: #23a55a; --bg: #ddf7e7; }
  .math    { --c: #2f80ed; --bg: #e0eeff; }
  .card.soon { cursor: default; opacity: .6; filter: grayscale(.4); }
  .card.soon:hover { transform: none; box-shadow: 0 8px 0 var(--c); }
  .card.soon .go { background: #aaa; }
  footer { margin-top: 48px; font-size: 15px; color: #777; }
  /* 贊助按鈕與 QR 彈窗 */
  .donate {
    margin-top: 40px; padding: 14px 32px; border-radius: 999px; cursor: pointer;
    background: #fff; color: #c98a00; border: 4px solid #f5b800; box-shadow: 0 6px 0 #f5b800;
    font: 800 20px "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    transition: transform .15s, box-shadow .15s;
  }
  .donate:hover, .donate:focus-visible { transform: translateY(-4px); box-shadow: 0 10px 0 #f5b800; outline: none; }
  .donate:active { transform: translateY(3px); box-shadow: 0 3px 0 #f5b800; }
  .donate.report { display: inline-block; text-decoration: none; color: #2a9d8f; border-color: #2a9d8f; box-shadow: 0 6px 0 #2a9d8f; margin-top: 36px; }
  .duo { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin-top: 36px; }
  .duo .donate.report { margin-top: 0; }
  .donate.wb { color: #e2574c; border-color: #e2574c; box-shadow: 0 6px 0 #e2574c; }
  .donate.move { color: #2a7d6f; border-color: #7cc7bb; box-shadow: 0 6px 0 #7cc7bb; font-size: 17px; margin-top: 18px; }
  .donate.sky { color: #6c4ad6; border-color: #8a6cff; box-shadow: 0 6px 0 #8a6cff; }
  .donate.pet { color: #b5651d; border-color: #e0954a; box-shadow: 0 6px 0 #e0954a; }
  .duo + .donate { margin-top: 22px; }
  .feedback { margin-top: 18px; padding: 8px 20px; border-radius: 999px; background: #fff; color: #6c5ce7; border: 2px solid #6c5ce7; font-weight: 700; font-size: 16px; text-decoration: none; }
  .feedback:hover, .feedback:focus-visible { background: #6c5ce7; color: #fff; outline: none; }
  .sponsor { margin-top: 26px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #b07a00; }
  .sponsor .kneel { font-size: 72px; line-height: 1; display: inline-block; animation: kowtow 1.6s ease-in-out infinite; transform-origin: 50% 90%; filter: drop-shadow(0 4px 4px rgba(0,0,0,.15)); }
  .sponsor .txt { font-weight: 900; font-size: 20px; padding: 6px 18px; border-radius: 999px; background: #fff; border: 3px solid #f5b800; box-shadow: 0 5px 0 #f5b800; }
  .sponsor:hover .txt, .sponsor:focus-visible .txt { background: #fff7d6; }
  .sponsor:focus-visible { outline: none; }
  @keyframes kowtow { 0%, 60%, 100% { transform: rotate(0deg); } 30% { transform: rotate(-18deg) translateY(4px); } }
  @media (prefers-reduced-motion: reduce) { .sponsor .kneel { animation: none; } }
  /* 首頁的萌寵改在天空吊橋上走，不另外到處散步 */
  #kg-pet { display: none !important; }
  .note { margin-bottom: 18px; }
  #qr { margin: auto; border: none; border-radius: 24px; padding: 14px; max-width: min(92vw, 440px); background: #fff; }
  #qr::backdrop { background: rgba(0, 0, 0, .55); }
  #qr img { display: block; width: 100%; height: auto; border-radius: 14px; }
  #qr .close {
    display: block; margin: 12px auto 2px; padding: 10px 36px; border-radius: 999px; border: none; cursor: pointer;
    background: #2a9d8f; color: #fff; font: 700 17px "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
  }
</style>
</head>
<body>
  <div id="kgp-root" style="align-self:flex-end;margin:-28px 0 10px"></div>
  <h1>🏫 國小課業複習遊戲</h1>
  <p class="sub">選一個科目，開始闖關吧！</p>
  <p class="note">（請依照各學校教學進度內容，調整單元闖關順序）</p>

  <!-- 天空島嶼：點島嶼進入科目，萌寵會在吊橋上走來走去（islands.js） -->
  <div id="sky-islands" role="navigation" aria-label="選擇科目"></div>
  <noscript>
    <p><a href="https://kuog88.github.io/social-puzzle/">社會</a>｜<a href="https://kuog88.github.io/science5-quest/">自然</a>｜<a href="https://kuog88.github.io/math5a-lab/">數學</a>｜<a href="https://kuog88.github.io/guoyu-island/">國文</a>｜<a href="https://kuog88.github.io/galaxy-english/">英文</a></p>
  </noscript>

  <div class="duo">
    <a class="donate report" href="report.html">📊 家長報表</a>
    <a class="donate report wb" href="wrongbook.html">📕 錯題本</a>
    <button type="button" id="sky-btn" class="donate report sky" onclick="window.KGSky && KGSky.open()">💎 天空城商店</button>
    <button type="button" id="pet-btn" class="donate report pet" onclick="window.KGPet && KGPet.picker()">🐾 選一隻萌寵陪我</button>
  </div>
  <button type="button" class="donate report move" onclick="window.KGBackup && KGBackup.open()">📦 進度搬家（換手機、換平板）</button>
  <!-- 贊助：點跪拜小人就到 IG -->
  <a class="sponsor" href="https://www.instagram.com/xt4photo?obrf=Z3o2Z2Vna25sa2Vw&amp;utm_source=qr" target="_blank" rel="noopener" title="金主贊助（到 IG 找我）">
    <span class="kneel" aria-hidden="true">🙇</span>
    <span class="txt">金主贊助》</span>
  </a>
  <a class="feedback" href="https://docs.google.com/forms/d/e/1FAIpQLSf0vTXtqv25ZqDAn1FIAj6_xffuh6t8_2NYjqkmi0ryZiveIA/viewform" target="_blank" rel="noopener">💬 意見回饋</a>

  <footer>國文／社會／自然／數學／英文 · 遊戲製作者：基爸</footer>

<script>
  // 萌寵不自動跳出，按鈕顯示目前的萌寵
  window.onKGPetChange = function () { if (!window.KGPet) return; var d = KGPet.get(), b = document.getElementById('pet-btn'), p = d.active && KGPet.pet(d.active); if (b) b.textContent = p ? '🐾 我的萌寵：' + p.name : '🐾 選一隻萌寵陪我'; };
  window.addEventListener('load', window.onKGPetChange);
</script>

</html>
